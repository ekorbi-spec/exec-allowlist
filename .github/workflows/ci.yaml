name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KYVERNO_CLI_VERSION: v1.19.1
  KIND_VERSION: v0.33.0

jobs:
  kyverno-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Kyverno CLI
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kyverno
          kyverno version
      - run: make kyverno-test

  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.mod
      - run: make lint go-test

  # make demo on kind: Kyverno must reject the bad Deployment and Tetragon
  # must SIGKILL non-allowlisted execs. demo/demo.sh asserts both.
  e2e:
    needs: [kyverno-test, go-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.mod
      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
      - name: Host kernel
        run: |
          uname -r
          ls -l /sys/kernel/btf/vmlinux
      - run: make demo
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get tracingpolicynamespaced -A -o yaml || true
          kubectl -n kube-system logs ds/tetragon -c tetragon --tail 200 || true
          kubectl -n kube-system logs ds/tetragon -c export-stdout --tail 50 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
      # Record the README GIF from the same cluster. demo.sh already passed
      # above, so the recording shows a known-good run.
      - uses: charmbracelet/vhs-action@v2
        with:
          version: v0.12.1
          path: demo/demo.tape
      - uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error
