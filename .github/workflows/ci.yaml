name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KYVERNO_CLI_VERSION: v1.19.1
  KIND_VERSION: v0.33.0

jobs:
  kyverno-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Kyverno CLI
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kyverno
          kyverno version
      - run: make kyverno-test

  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.mod
      - run: make lint go-test

  # make demo on kind: Kyverno must reject the bad Deployment and Tetragon
  # must SIGKILL non-allowlisted execs. demo/demo.sh asserts both.
  e2e:
    needs: [kyverno-test, go-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.mod
      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
      - name: Host kernel
        run: |
          uname -r
          ls -l /sys/kernel/btf/vmlinux
      - run: make demo
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get tracingpolicynamespaced -A -o yaml || true
          kubectl -n kube-system logs ds/tetragon -c tetragon --tail 200 || true
          kubectl -n kube-system logs ds/tetragon -c export-stdout --tail 50 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          echo "--- runc on the node"
          docker exec "${KIND_CLUSTER:-exec-allowlist}-control-plane" sh -c 'command -v runc; runc --version; echo "pid1 mnt: $(readlink /proc/1/ns/mnt)"; echo "containerd mnt: $(readlink /proc/$(pidof containerd)/ns/mnt)"' || true
          echo "--- same policy in audit mode: what does Tetragon see for a kubectl exec?"
          kubectl -n demo get deploy sample-app -o json \
            | (cd controller && go run ./cmd/render --mode audit --runtime-mnt-ns "$(docker exec exec-allowlist-control-plane readlink /proc/1/ns/mnt | tr -dc 0-9)") | kubectl apply -f - || true
          sleep 10
          kubectl -n demo exec deploy/sample-app -- /usr/bin/sleep 0 || true
          kubectl -n demo exec deploy/sample-app -- /usr/bin/true || true
          sleep 40 # Tetragon may hold events ~30s while resolving process info
          kubectl -n kube-system logs ds/tetragon -c export-stdout --tail 2000 \
            | jq -c 'select(.process_kprobe) | .process_kprobe | {action, policy_name, path: .args[0].linux_binprm_arg.path, bin: .process.binary, args: .process.arguments, parent: .parent.binary, pod: .process.pod.name}' \
            | tail -20 || true
      # Record the README GIF from the same cluster. demo.sh already passed
      # above, so the recording shows a known-good run.
      - uses: charmbracelet/vhs-action@v2
        with:
          version: v0.12.1
          path: demo/demo.tape
      - uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error
