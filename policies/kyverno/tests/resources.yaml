---
# The space bug: " /bin/sh" used to dodge the shell blocklist.
apiVersion: v1
kind: Pod
metadata:
  name: bad-space
  namespace: apps-audit
  annotations:
    exec-allowlist.io/binaries: /usr/local/bin/app, /bin/sh
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-tab
  namespace: apps-audit
  annotations:
    exec-allowlist.io/binaries: "/usr/local/bin/app,\t/usr/bin/curl"
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-trailing-comma
  namespace: apps-audit
  annotations:
    exec-allowlist.io/binaries: /usr/local/bin/app,
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-empty-entry
  namespace: apps-audit
  annotations:
    exec-allowlist.io/binaries: /usr/local/bin/app,,/usr/bin/curl
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
