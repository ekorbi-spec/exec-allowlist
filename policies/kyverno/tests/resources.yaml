# ---------------------------------------------- bad: entries-well-formed ----
apiVersion: v1
kind: Pod
metadata:
  name: bad-relative
  namespace: apps-audit
  annotations:
    exec-allowlist.io/binaries: app,/usr/bin/curl
spec:
