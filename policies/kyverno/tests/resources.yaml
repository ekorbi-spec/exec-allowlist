# Good and bad workloads for require-exec-allowlist.
# Names say what each one exercises; expected results live in kyverno-test.yaml.

# ---------------------------------------------------------------- good ----
apiVersion: v1
kind: Pod
metadata:
  name: good-audit
  namespace: apps-audit
  annotations:
    exec-allowlist.io/binaries: /usr/local/bin/app,/usr/bin/curl
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: good-prod
  namespace: apps-prod
  annotations:
    exec-allowlist.io/binaries: /usr/local/bin/app
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
# Not opted in: no annotation needed.
apiVersion: v1
kind: Pod
metadata:
  name: unmanaged
  namespace: default
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
# Opted-out prod namespace: shells are not policed here (no TracingPolicy
# would be generated anyway).
apiVersion: v1
kind: Pod
metadata:
  name: shell-prod-unmanaged
  namespace: prod-unmanaged
  annotations:
    exec-allowlist.io/binaries: /bin/sh
spec:
  containers:
    - name: app
      image: example.com/app:1.0
---
# ----------------------------------------------- bad: annotation-present ----
apiVersion: v1
