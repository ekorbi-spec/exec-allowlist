# ------------------------------------------------ Deployments (autogen) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deploy
  namespace: apps-prod
spec:
  selector:
    matchLabels: {app: good-deploy}
  template:
    metadata:
      labels: {app: good-deploy}
      annotations:
        exec-allowlist.io/binaries: /usr/local/bin/app
    spec:
      containers:
        - name: app
          image: example.com/app:1.0
---
# The annotation must be on the pod template, not the Deployment itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deploy-wrong-place
  namespace: apps-audit
  annotations:
    exec-allowlist.io/binaries: /usr/local/bin/app
spec:
  selector:
    matchLabels: {app: bad-deploy-wrong-place}
  template:
    metadata:
      labels: {app: bad-deploy-wrong-place}
    spec:
      containers:
        - name: app
          image: example.com/app:1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deploy-shell-prod
  namespace: apps-prod
spec:
  selector:
    matchLabels: {app: bad-deploy-shell-prod}
  template:
    metadata:
      labels: {app: bad-deploy-shell-prod}
      annotations:
        exec-allowlist.io/binaries: /usr/local/bin/app, /bin/bash
    spec:
